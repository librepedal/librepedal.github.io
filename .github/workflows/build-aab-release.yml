name: Construir AAB firmado (Google Play)

# A diferencia de "Construir APK Android" (que corre solo en cada push, genera
# un .apk de debug sin firmar), este workflow NO corre automáticamente — se
# lanza a mano desde GitHub cuando Inty decide subir una versión nueva a Play
# Console. Genera el .aab de RELEASE, firmado con el keystore real, listo
# para subir directo.
on:
  workflow_dispatch:
  # 2026-10-08: también al subir una rama release/play-* (la rama de lanzamiento ya trae lo nativo junto: GPS con
  # pantalla apagada + Google Sign-In). Así se compila sin tener que entrar a GitHub. Nunca sube nada a Play.
  push:
    branches: [ 'release/play-*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          # Ver build-apk.yml: Capacitor 8 exige Node >=22, este workflow fallaba igual.
          node-version: '22'

      - name: Instalar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Ver build-apk.yml: Capacitor 8 / AGP 8.13.0 exigen JDK 21, este workflow
          # fallaba igual con "invalid source release: 21".
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta web (www/)
        run: node scripts/copy-web.js

      - name: Agregar plataforma Android
        run: npx cap add android

      # google-services.json y rgcfaIncludeGoogle (Google Sign-In nativo, 2026-10-03) los
      # pone scripts/patch-android.js, más abajo -- así también los recibe build-apk.yml.

      - name: Instalar plataforma Android 16 (API 36) en el SDK del runner
        # Android 16/API 36 es muy reciente: el SDK preinstalado en el runner de
        # GitHub puede no traerla todavía. La instalamos a mano antes de compilar
        # para no depender de que la imagen del runner ya la incluya. "sdkmanager"
        # no está directo en el PATH (falló con "command not found" la primera
        # vez) — lo buscamos dentro del SDK en vez de asumir una ruta fija.
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=$SDK_ROOT"
          SDKMANAGER=$(find "$SDK_ROOT" -maxdepth 5 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager encontrado en: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then echo "No se encontró sdkmanager en $SDK_ROOT"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # build-tools;35.0.0 tambien hace falta: AGP 8.13.0 (Capacitor 8) pide esa
          # revision por defecto para el paso de compilacion aunque compileSdk sea 36
          # (confirmado con un build local: "Failed to find Build Tools revision 35.0.0"
          # hasta instalarla aparte). No hay buildToolsVersion fijado a mano en
          # variables.gradle -- mas simple instalar ambas revisiones que fijar una.
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Subir a API 36 (Google Play exige apuntar al menos a API 36 antes del 30-ago-2026)
        run: |
          sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" android/variables.gradle
          cat android/variables.gradle

      - name: Generar ícono y splash desde resources/ (logo real de Libre Pedal)
        run: npx @capacitor/assets generate --android

      - name: Inyectar permisos nativos
        run: node scripts/patch-android.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar firma y versionCode/versionName (desde version.txt)
        run: node scripts/patch-android-signing.js

      - name: Decodificar el keystore desde el secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/librepedal-release.keystore

      - name: Compilar AAB (release, firmado)
        env:
          ANDROID_KEYSTORE_PATH: librepedal-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      # Verificar el ARTEFACTO, no el log (ESTADO-LOGIN-GOOGLE.md: en agosto salieron 3 AAB sin el plugin de login
      # porque se compilaron desde la rama equivocada). Falla si falta algo de lo que tiene que viajar en la app.
      - name: Revisar el AAB por dentro (plugins nativos y configuración)
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "AAB: $AAB ($(du -h "$AAB" | cut -f1))"
          unzip -p "$AAB" base/assets/capacitor.plugins.json > /tmp/plugins.json
          unzip -p "$AAB" base/assets/capacitor.config.json > /tmp/config.json
          echo "--- plugins nativos:"; cat /tmp/plugins.json; echo
          echo "--- configuración:"; cat /tmp/config.json; echo
          node -e '
            const p=require("/tmp/plugins.json").map(x=>x.pkg), c=require("/tmp/config.json"); const falta=[];
            for (const k of ["@capacitor-community/background-geolocation","@capacitor-community/text-to-speech","@capacitor-community/speech-recognition","@capacitor/local-notifications","@capacitor-firebase/authentication"]) if(!p.includes(k)) falta.push("plugin "+k);
            if(!(c.android&&c.android.useLegacyBridge===true)) falta.push("android.useLegacyBridge=true (GPS y voz con la pantalla apagada)");
            if(c.server&&c.server.url!=="https://librepedal.cl") falta.push("server.url debe ser https://librepedal.cl");
            if(falta.length){ console.error("FALTA EN EL AAB: "+falta.join(" · ")); process.exit(1); }
            console.log("AAB OK: "+p.length+" plugins, useLegacyBridge, server.url="+c.server.url);'

      - name: Borrar el keystore del runner (no debe quedar ni como artefacto)
        if: always()
        run: rm -f android/app/librepedal-release.keystore

      - name: Publicar el AAB como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: LibrePedal-AAB-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
