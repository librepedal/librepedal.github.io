name: (Temporal) Generar keystore de release

on:
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar keystore + contraseña aleatoria fuerte
        run: |
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair \
            -v \
            -keystore librepedal-release.keystore \
            -alias librepedal \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Libre Pedal, OU=Libre Pedal, O=Libre Pedal, L=Chile, ST=Chile, C=CL"
          echo "STOREPASS=$PASS" > credenciales.txt
          echo "ALIAS=librepedal" >> credenciales.txt
          echo "KEYPASS=$PASS" >> credenciales.txt
          base64 -w0 librepedal-release.keystore > librepedal-release.keystore.b64
          echo "Listo. Verificando con keytool -list:"
          keytool -list -v -keystore librepedal-release.keystore -storepass "$PASS" -alias librepedal | head -20

      - name: Subir como artefacto (keystore + base64 + contraseña, todo junto)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-nuevo-NO-COMPARTIR
          path: |
            librepedal-release.keystore
            librepedal-release.keystore.b64
            credenciales.txt
          retention-days: 1
