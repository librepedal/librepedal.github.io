name: Escaneo de secretos

# Historial real de este proyecto: fuga de tokens el 20-jul-2026, un stealer con
# secretos en texto plano el 18-ago, y documentos confidenciales de inversionista
# que casi se suben 2 veces a este mismo repo publico (verificado a mano cada vez,
# nunca de forma automatica). Esto corre gitleaks en cada push/PR para cazar
# credenciales/tokens ANTES de que lleguen a main, sin depender de que alguien se
# acuerde de revisar el diff a ojo.
on:
  push:
    # 2026-10-17: todas las ramas -- prueba/** y release/play-* también publican o firman.
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

# Auditoría de seguridad 2026-10-17: permisos mínimos por defecto. El token de GitHub solo
# lee; el job que necesita escribir (publicar una Release) lo pide él mismo.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el codigo (historial completo, gitleaks lo necesita)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Escanear con gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
