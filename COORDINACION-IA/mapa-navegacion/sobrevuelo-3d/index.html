<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="../../../icon-192.png">
<title>Sobrevuelo 3D · propuesta</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* tokens de la app (estilos.css :root) */
:root{--p:#fc4c02;--d:#0a0f1d;--g:#ffd700;--surf:#141a2b;--surf-2:#0f1524;--br:rgba(255,255,255,.09);--tx:#e8edf6;--tx2:#9fb3c8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--d);color:var(--tx);font:500 14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#mapa{position:absolute;inset:0}
.barra{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:5}
.titulo{flex:1;min-width:0;background:rgba(10,15,29,.82);backdrop-filter:blur(8px);border:1px solid var(--br);border-radius:14px;padding:8px 12px}
.titulo b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titulo span{font-size:.72rem;color:var(--tx2)}
.seg{display:flex;background:rgba(10,15,29,.82);backdrop-filter:blur(8px);border:1px solid var(--br);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--tx2);font:700 .78rem system-ui;padding:8px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--p);color:#0a0f1d}
.capa{position:absolute;right:12px;bottom:calc(232px + env(safe-area-inset-bottom));z-index:5}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(10,15,29,0),rgba(10,15,29,.88) 22%,rgba(10,15,29,.97))}
.datos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.dato{background:var(--surf);border:1px solid var(--br);border-radius:12px;padding:7px 8px}
.dato small{display:block;font-size:.62rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}
.dato b{font-size:1.02rem;font-variant-numeric:tabular-nums}
.dato b i{font-style:normal;font-size:.7rem;color:var(--tx2);margin-left:2px}
.perfil{position:relative;height:84px;background:var(--surf-2);border:1px solid var(--br);border-radius:12px;overflow:hidden;cursor:pointer;touch-action:none}
.perfil canvas{width:100%;height:100%;display:block}
.ctrl{display:flex;gap:8px;margin-top:8px;align-items:center}
.btn{border:0;border-radius:12px;font:800 .85rem system-ui;padding:11px 14px;cursor:pointer}
.play{background:var(--p);color:#0a0f1d;flex:1}
.vel{background:var(--surf);color:var(--tx);border:1px solid var(--br)}
.leyenda{display:flex;gap:10px;font-size:.66rem;color:var(--tx2);margin:0 2px 6px;flex-wrap:wrap}
.leyenda i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.nota{position:absolute;left:12px;right:12px;transition:opacity .4s;top:calc(66px + env(safe-area-inset-top));z-index:4;max-width:330px;background:rgba(10,15,29,.86);border:1px solid var(--br);border-left:3px solid var(--p);border-radius:10px;padding:8px 10px;font-size:.74rem;color:var(--tx2)}
.nota b{color:var(--tx)}
.cargando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:var(--d);font-weight:700;color:var(--tx2)}
/* marcador: mismas reglas que estilos.css (.sbv-*) */
.sbv-rider{position:relative;width:78px;height:74px;pointer-events:none}
.sbv-bici svg{width:100%;height:100%;overflow:visible}
.sbv-rider.atras{width:80px;height:88px}
.sbv-rider.atras .sbv-bici{position:relative;width:80px;height:88px;transform-origin:50% 96%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.sbv-cuerpo,.sbv-cuerpo svg{width:100%;height:100%;display:block}
.sbv-cabeza{position:absolute}.sbv-cabeza svg{width:100%;height:100%;display:block}
.sbv-incl{position:relative;width:100%;height:100%;transform-origin:50% 96%}
.sbv-sombra{position:absolute;left:50%;bottom:-3px;width:34px;height:9px;margin-left:-17px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}
.punto-ruta{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #e11d48;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
@media (max-width:420px){.dato b{font-size:.92rem}.titulo span{display:none}}
body.corriendo .nota,body.pp-on .nota{opacity:0;pointer-events:none}
/* durante el sobrevuelo, menos interfaz: el perfil ya lleva los colores de pendiente */
.leyenda,.capa{transition:opacity .3s}
body.corriendo .leyenda,body.corriendo .capa{opacity:0;pointer-events:none}
#mascota{max-width:118px;font-size:.78rem;padding:11px 8px}
/* giro corto al pasar de espaldas a costado */
.sbv-rider .sbv-bici,.sbv-rider .sbv-lado{transition:transform .18s cubic-bezier(.4,0,.2,1)}
.sbv-rider.girando .sbv-bici,.sbv-rider.girando .sbv-lado{transform:scaleX(.08)!important}
/* mascota del Taller asomada en el canasto (de espaldas): delante del manubrio, junto al brazo derecho */
.sbv-asoma{position:absolute;left:58%;top:44%;width:30px;height:27px;pointer-events:none}
.sbv-asoma svg{width:100%;height:100%;overflow:visible}
.sbv-rider.de-lado .sbv-asoma{display:none}
.pp-masc-svg{width:60px;height:54px}.pp-masc-svg svg{width:100%;height:100%}
/* hito de la cima */
.hito{font:800 11px system-ui;color:#0a0f1d;background:#ffd700;border-radius:8px;padding:3px 7px;box-shadow:0 0 12px rgba(255,215,0,.6),0 2px 6px rgba(0,0,0,.45);white-space:nowrap}
/* Pistero de costado (bici real de la app, viewBox 100x84) cuando la toma es lateral */
.sbv-lado{position:absolute;left:-14px;bottom:0;width:108px;height:91px;display:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55));transform-origin:50% 100%}
.sbv-lado svg{width:100%;height:100%;overflow:visible}
.sbv-rider.de-lado .sbv-bici{display:none}.sbv-rider.de-lado .sbv-lado{display:block}
/* mascota que corre al lado */
.masc{width:46px;height:44px;pointer-events:none}
/* OJO: no ponerle position al elemento raíz de un marcador: pisa el position:absolute de MapLibre
   (.maplibregl-marker) y el marcador queda apilado debajo de los anteriores, corrido de su punto */
.maplibregl-marker.sbv-rider,.maplibregl-marker.masc{position:absolute}
.masc canvas{position:absolute;left:0;bottom:2px;width:46px;height:auto;max-height:44px;object-fit:contain;transform-origin:50% 100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.masc-sombra{position:absolute;left:50%;bottom:-2px;width:30px;height:7px;margin-left:-15px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.5),rgba(0,0,0,0) 70%)}
/* PRIMER PLANO: tarjeta sobria (tokens de la app), entra con fundido y 10 px de desplazamiento */
.pp{position:absolute;left:12px;top:calc(66px + env(safe-area-inset-top));z-index:6;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;background:rgba(10,15,29,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tx);border:1px solid var(--br);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transform:translateY(-10px);transition:opacity .45s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1);pointer-events:none;max-width:calc(100% - 24px)}
.pp.on{opacity:1;transform:none}
.pp-marco{--ring:#39ff88;width:64px;height:64px;border-radius:50%;flex:none;overflow:hidden;background:radial-gradient(circle at 50% 35%,#1e293b,#0f172a);box-shadow:0 0 0 2px var(--ring),0 0 18px color-mix(in srgb,var(--ring) 55%,transparent);display:flex;align-items:center;justify-content:center;transition:box-shadow .5s}
.pp-cara{width:118%;height:118%;margin-top:14%}.pp-cara svg{width:100%;height:100%}
.pp-texto b{display:block;font:800 1.05rem/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}
.pp-texto span{display:block;margin-top:3px;font:600 .76rem system-ui;color:var(--tx2)}
.pp-masc canvas{height:52px;width:auto;display:block}
.pp.cansado .pp-marco,.pp.enojado .pp-marco{--ring:#ff8a1f}
.pp.agotado .pp-marco{--ring:#ff2d6f}
.pp.adrenalina .pp-marco,.pp.emocionado .pp-marco,.pp.sorprendido .pp-marco{--ring:#22d3ff}
.pp.orgulloso .pp-marco{--ring:#ffd700}
@media (prefers-reduced-motion:reduce){.pp{transition:opacity .2s;transform:none}}
@media (max-height:700px){ .perfil{height:64px} .dato{padding:5px 8px} .dato b{font-size:.92rem} .ctrl{margin-top:6px} .btn{padding:9px 12px} .pp-marco{width:52px;height:52px} }
/* ROSTRO de Pistero sobre el rastro (sin bici). Raíz del marcador SIN position (la pone MapLibre) */
.cara-mk{width:68px;height:84px;pointer-events:none;--c:#39ff88;--lat:1.15s}
.cm-pin{position:absolute;left:50%;bottom:0;width:3px;height:20px;margin-left:-1.5px;border-radius:2px;background:linear-gradient(to top,#fff,var(--c) 45%,var(--c));box-shadow:0 0 8px var(--c)}
.cm-in{position:absolute;left:1px;top:0;width:66px;height:66px;transform-origin:50% 100%}
.cm-anillo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 32%,#1e293b,#0a0f1d 75%);box-shadow:0 0 0 3px var(--c),0 0 14px var(--c),0 6px 14px rgba(0,0,0,.55)}
/* latido = halo que crece y se apaga: solo transform/opacity → lo hace la GPU sin repintar */
.cm-halo{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 68%);opacity:0;animation:cmLate var(--lat) ease-out infinite;will-change:transform,opacity}
@keyframes cmLate{0%{opacity:0;transform:scale(.85)}10%{opacity:.75;transform:scale(1)}22%{opacity:.35;transform:scale(1.04)}30%{opacity:.6;transform:scale(1.08)}100%{opacity:0;transform:scale(1.22)}}
.cm-caras{position:absolute;inset:0;border-radius:50%;overflow:hidden;clip-path:circle(50% at 50% 50%)}
.cm-c{position:absolute;left:-13%;top:-9%;width:126%;height:106%;opacity:0;transform:scale(.96);transition:opacity .4s cubic-bezier(.4,0,.2,1),transform .4s cubic-bezier(.4,0,.2,1)}
.cm-c.on{opacity:1;transform:none}
.cm-c svg{width:100%;height:100%;display:block}
/* gota de sudor que cae en el esfuerzo fuerte */
.cm-gota{position:absolute;right:-2px;top:10px;width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7fd0ff;box-shadow:0 0 6px #7fd0ff;opacity:0}
.cara-mk.suda .cm-gota{animation:cmGota 1.4s ease-in infinite}
@keyframes cmGota{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(26px)}}
.pp{padding:10px 16px;border-left:3px solid var(--ring,#39ff88)}
.pp.cansado,.pp.enojado{--ring:#ff8a1f}.pp.agotado{--ring:#ff2d6f}.pp.adrenalina,.pp.emocionado,.pp.sorprendido{--ring:#22d3ff}.pp.orgulloso{--ring:#ffd700}.pp.contento{--ring:#39ff88}
@media (prefers-reduced-motion:reduce){.cm-halo,.cara-mk.suda .cm-gota{animation:none}}
/* modelos por capas (Pistero nuevo): su SVG animado ocupa el círculo */
.cm-modelo{position:absolute;inset:0}.cm-modelo svg{width:100%!important;height:100%!important;display:block}
.cara-mk.modelo .cm-anillo{background:radial-gradient(circle at 50% 30%,#1b2333,#05070c 72%)}
#personaje{max-width:150px;font-size:.78rem;padding:11px 8px}
/* RESUMEN del viaje al terminar (como el cierre de Relive/Strava): reemplaza los datos del panel */
.resumen{position:absolute;left:12px;right:12px;bottom:calc(176px + env(safe-area-inset-bottom));max-height:calc(100% - 260px);overflow:auto;z-index:6;max-width:520px;margin:0 auto;background:rgba(10,15,29,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--br);border-radius:18px;padding:14px;opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);pointer-events:none}
body.fin .resumen{opacity:1;transform:none;pointer-events:auto}
body.fin .datos,body.fin .leyenda,body.fin .nota,body.fin .pp{opacity:0;pointer-events:none}   /* el resumen ya dice el tiempo: la viñeta de llegada se va */
.rs-tit b{display:block;font:800 1.15rem/1.15 system-ui;letter-spacing:-.01em}.rs-tit span{font:600 .74rem system-ui;color:var(--tx2)}
.rs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.rs-dato{background:var(--surf);border:1px solid var(--br);border-radius:12px;padding:7px 8px}.rs-dato small{display:block;font-size:.6rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}.rs-dato b{font-size:.95rem;font-variant-numeric:tabular-nums}
.rs-hitos{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.rs-hitos li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.04);border-left:3px solid #39ff88;font-size:.78rem}
.rs-hitos li span{color:var(--tx2)}.rs-hitos li b{font-weight:700;text-align:right}
.rs-hitos li.sube{border-color:#ff8a1f}.rs-hitos li.empina{border-color:#ff2d6f}.rs-hitos li.baja{border-color:#22d3ff}.rs-hitos li.cima{border-color:#ffd700}
@media (max-width:380px){.rs-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-height:700px){.resumen{bottom:calc(150px + env(safe-area-inset-bottom));padding:10px}.rs-hitos li{padding:4px 8px}}
.tu-ruta{cursor:pointer;color:var(--tx);font:700 .78rem system-ui;padding:9px 10px;white-space:nowrap}
body.corriendo .tu-ruta{opacity:.4;pointer-events:none}
@media (max-width:420px){.titulo span{display:block;font-size:.66rem}}
.son{display:flex;align-items:center;justify-content:center;padding:9px 11px}.son .tacha{display:none}.son.mudo .onda{display:none}.son.mudo .tacha{display:inline}.son.mudo{color:var(--tx2)}
.rs-comp{width:100%;margin-top:10px}
.ctrl .play{white-space:nowrap;flex:1 0 auto}#personaje{flex:0 1 auto;min-width:0;max-width:128px;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="mapa"></div>
<div class="cargando" id="cargando">Preparando el relieve real del camino…</div>
<div class="barra">
  <div class="titulo"><b id="tit"></b><span id="titSub"></span></div>
  <label class="seg tu-ruta" title="Carga un GPX (Historial → Exportar GPX). Se procesa en tu navegador; para pegarla al camino se envía solo la lista de puntos a Valhalla (FOSSGIS)."><input type="file" id="gpx" accept=".gpx,application/gpx+xml" hidden><span>Tu ruta</span></label>
  <div class="seg" id="modo"><button data-m="hoy">Hoy</button><button data-m="nuevo" class="on">Propuesta</button></div>
</div>
<div class="nota" id="nota"></div>
<div class="pp" id="pp"><div class="pp-cara" hidden></div><div class="pp-texto"><b class="pp-txt"></b><span class="pp-sub"></span></div><div class="pp-masc"></div></div>
<div class="capa"><div class="seg" id="capa"><button data-c="sat" class="on">Satélite</button><button data-c="calles">Calles</button></div></div>
<div class="resumen" id="resumen"></div>
<div class="panel">
  <div class="datos">
    <div class="dato"><small>Recorrido</small><b id="dKm">0,0<i>km</i></b></div>
    <div class="dato"><small id="lAlt">Altura</small><b id="dAlt">–<i>m</i></b></div>
    <div class="dato"><small>Pendiente</small><b id="dPend">–<i>%</i></b></div>
    <div class="dato"><small>Subido</small><b id="dSub">0<i>m</i></b></div>
  </div>
  <div class="leyenda" id="leyenda"><span><i style="background:#39ff88;box-shadow:0 0 6px #39ff88"></i>plano</span><span><i style="background:#ffe14d;box-shadow:0 0 6px #ffe14d"></i>3–6 %</span><span><i style="background:#ff8a1f;box-shadow:0 0 6px #ff8a1f"></i>6–9 %</span><span><i style="background:#ff2d6f;box-shadow:0 0 6px #ff2d6f"></i>+9 %</span><span><i style="background:#22d3ff;box-shadow:0 0 6px #22d3ff"></i>bajada</span></div>
  <div class="perfil" id="perfil"><canvas id="cv"></canvas></div>
  <div class="ctrl"><button class="btn play" id="play">▶ Ver sobrevuelo</button><select class="btn vel" id="personaje" aria-label="Personaje elegido en Elige tu Pistero (demo)"></select><select class="btn vel" id="mascota" aria-label="Mascota elegida en el Taller (demo)" hidden></select><button class="btn vel son" id="sonido" aria-label="Sonido del sobrevuelo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" stroke="none"/><path class="onda" d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path class="onda" d="M18.2 6.5a8 8 0 0 1 0 11"/><path class="tacha" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg></button><button class="btn vel" id="vel">×1</button></div>
</div>

<!-- Pistero real de la app (mismos archivos que index.html) -->
<script>var cu=null, us={};</script>
<script src="../../../pistero-personalizacion-datos.js"></script>
<script src="../../../pistero-armario.js"></script>
<script src="../../../pistero-apariencia.js"></script>
<script src="../../../pistero-bici.js"></script>
<script src="../../../pistero-bici-atras.js"></script>
<script src="../../../pistero-sonidos.js"></script>
<script src="personajes/ciber-capas.js"></script>
<script src="personajes/orbe-capas.js"></script>
<script src="personajes/slime-capas.js"></script>
<script src="personajes/vinilo-capas.js"></script>
<script src="sobrevuelo-3d.js"></script>
</body>
</html>
